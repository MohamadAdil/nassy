<!DOCTYPE html>
<html lang="en">

<head>
    <!-- Basic Page Needs -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact US - NASSY</title>
    <meta name="description"
        content="Discover NASSY – a baby and kids clothing brand creating soft, breathable and ethical garments made for comfort, delicate skin and everyday adventures.">
    <!--  Font -->
    <link rel="stylesheet" href="./font/font.css">
    <!-- Bootstrap CSS  -->
    <link href="./css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css" />
    <!-- Swiper -->
    <link rel="stylesheet" href="./css/swiper-bundle.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="./css/style.css">
    <link rel="stylesheet" href="./css/responsive.css">
    <!-- Favicon -->
    <link rel="icon" href="https://nassy.com.au/wp-content/uploads/2026/02/favicon-white-1.png"
        media="(prefers-color-scheme: dark)">
    <link rel="icon" href="https://nassy.com.au/wp-content/uploads/2026/02/favicon-black.png"
        media="(prefers-color-scheme: light)">
    <!-- Canonical Link -->
    <link rel="canonical" href="">
</head>

<body>
    <header></header>

    <!-- Content -->
    <main>
        <section class="cn-img-section">
            <div class="container">
                <div class="row">
                    <div class="col-md-6">
                        <div class="cn-img-content-wrap">
                            <h2>Get In Touch With Us</h2>
                            <p>We’d love to hear from you! Whether you have a question, feedback or just want to say hi.
                            </p>
                            <p>Please kindly note, our Customer Care team is available from 9AM to 5PM, Monday to Friday
                                (AEST). We’ll make sure to respond to your enquiry promptly.</p>

                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="cn-img-form-wrap">
                            <form action="#" method="post">

                                <div class="row g-4">

                                    <div class="col-md-6">
                                        <label for="name" class="form-label">Name <span>*</span></label>
                                        <input type="text" id="name" name="name" class="form-control" placeholder="Name"
                                            required>
                                    </div>

                                    <div class="col-md-6">
                                        <label for="mobile" class="form-label">Mobile <span>*</span></label>
                                        <input type="tel" id="mobile" name="mobile" class="form-control"
                                            placeholder="Mobile" required>
                                    </div>

                                    <div class="col-12">
                                        <label for="email" class="form-label">Email <span>*</span></label>
                                        <input type="email" id="email" name="email" class="form-control"
                                            placeholder="Email" required>
                                    </div>

                                    <div class="col-12">
                                        <label for="comments" class="form-label">Comments</label>
                                        <textarea id="comments" name="comments" class="form-control" rows="4"
                                            placeholder="Comments"></textarea>
                                    </div>

                                    <div class="col-12">
                                        <button type="submit" class="btn btn-main">
                                            Submit
                                        </button>
                                    </div>

                                </div>

                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </main>
    <!-- Content End -->

    <footer></footer>
    <!-- Bootstrap JS Bundle (with Popper) -->
    <script src="./js/jquery-4.0.0.js"></script>
    <script src="./js/swiper-bundle.min.js"></script>
    <script src="./js/bootstrap.bundle.min.js"></script>
    <script src="./js/custom.js"></script>
</body>

</html>
